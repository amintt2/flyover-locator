services:
  flyover:
    build: .
    environment:
      - SERVICE_FQDN_FLYOVER_8000=https://flyover.mciut.fr
      - DATA_DIR=/data
    volumes:
      # live sessions, uploads, ADS-B cache: kept across redeploys
      - flyover-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/config"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped

volumes:
  flyover-data:
